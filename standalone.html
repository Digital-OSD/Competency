</style></head><body><div id="app"></div><script>const CONTENT={"am":{"name":"Account Manager","time":10,"icon":"🚀","groups":{"DJC":60,"Website":30,"SOA":10},"questions":[{"id":"d1","category":"DJC","tool":"DJC","type":"choice","title":"Commodity or project?","prompt":"A customer wants to release commodity items from a large blanket order as they need them. Which tool would you point them to?","options":["Point them to DJC for the releases and ask their digital specialist to show them the project information available there.","Point them to the website blanket order tool and ask their digital specialist to show them how to release their items.","Point them to SOA for the releases and ask inside sales to give them access to the order-processing screen."],"key":"B","why":"The website blanket order tool is the right fit for commodity releases. Their digital specialist can show the customer how it works."},{"id":"d3","category":"DJC","tool":"DJC","type":"choice","title":"Shared project visibility","prompt":"A project manager keeps asking for material updates and a money sheet showing project financials. What would you suggest?","options":["Talk about DJC's 24/7 project access and connect them with their digital specialist to get started.","Talk about website product lists and connect them with their digital specialist to use those lists for project financials.","Talk about SOA's document processing and connect them with inside sales to use SOA as their shared project portal."],"key":"A","why":"DJC gives customers 24/7 access to project material and financials. Their digital specialist and PM team can help with setup and questions."},{"id":"d4","category":"DJC","tool":"DJC","type":"choice","title":"Permissions and communication","prompt":"Purchasing, project management and the field team need different access and a better way to stay on the same page. What DJC benefits would you highlight?","options":["Shared project information with the same permissions for everyone, making access easier to manage across purchasing and the field team.","Shared project information and access to financials so each user can track expenses, without needing personal support.","Shared project information with permissions for each user, so teams can see what they need and communicate faster and more accurately."],"key":"C","why":"DJC lets you set permissions for each user and helps teams communicate faster and more accurately. Personal support is still available."},{"id":"d5","category":"DJC","tool":"DJC","type":"choice","title":"Choose the primary solution","prompt":"A customer regularly sends a 40-line PO. The issue is the time we spend typing it in, not tracking a project. Which tool would you bring up?","options":["Encourage SOA with inside sales, while keeping the normal order review in place.","Bring up DJC with your digital specialist, using project releases to pull the line items from the customer's PO.","Bring up website blanket ordering with your digital specialist, using releases to process the PO the customer already sent."],"key":"A","why":"SOA helps us process the PO faster and more accurately. Inside sales still reviews it, and your digital specialist can help when things get tricky."},{"id":"pitch","category":"DJC","tool":"DJC","type":"write","title":"Pitch Studio","prompt":"In your words, what are the biggest advantages of DJC for our customers? How would you pitch it to a customer? Write 2-4 sentences.","options":[],"key":"Ungraded","why":"Your pitch is saved as you wrote it and isn't scored automatically. Think about 24/7 access to project material and financials, permissions for each user, and faster, more accurate communication between teams."},{"id":"w1","category":"Website","tool":"Website","type":"choice","title":"Website value","prompt":"A customer wants an easier way to handle everyday purchases. Which website features would you mention?","options":["Their pricing and availability, plus self-service quotes and orders. Their digital specialist can show them how to get started.","Their pricing and availability, plus access to SOA through the website. They can upload their own POs for internal processing.","Self-service quotes and orders, plus a shared view of project financials. They can use the website instead of setting up DJC."],"key":"A","why":"The website gives customers their pricing and availability, plus self-service quotes and orders. Their digital specialist can show them how to use it."},{"id":"w2","category":"Website","tool":"Website","type":"choice","title":"Repeat purchasing","prompt":"A customer wants to see what they bought over the last year and make repeat orders easier. Which website features would you mention?","options":["Custom product lists and SOA's match history, so they can use our previous product matches to look up their purchases.","The 12-month ordering history in FPP and custom product lists. Their digital specialist can show them how to use both.","The 12-month ordering history in FPP and DJC releases, so they can use project releases as their saved website lists."],"key":"B","why":"FPP shows 12 months of ordering history, and custom product lists help with repeat buys. Their digital specialist can walk the customer through both."},{"id":"w3","category":"Website","tool":"Website","type":"choice","title":"Account context","prompt":"A customer says the pricing or order history on the website doesn't look right. What should you check first?","options":["Check their login, then ask for a pricing correction before checking which account or job they're viewing.","Check their login, then use a coworker's account to compare the history while your digital specialist looks into it.","Check their login and selected account or job. If it still doesn't look right, contact your digital specialist."],"key":"C","why":"Start with the login and account or job. If those are right and the issue continues, contact your digital specialist. Don't use someone else's login."},{"id":"s1","category":"SOA","tool":"SOA","type":"choice","title":"SOA value","prompt":"How does using SOA to process a PO or bill of materials help our customers?","options":["We can process orders faster and more accurately by confirming or correcting the lines in SOA before sending them to Eclipse.","We can process orders faster, using a successful SOA upload to confirm the lines are accurate before sending them to Eclipse without editing.","We can process orders more accurately, while giving customers access to the SOA queue to check their project material and financials."],"key":"A","why":"SOA helps us process orders faster and more accurately. We upload the document, connect it to the customer and confirm or correct the lines before sending it to Eclipse. Your digital specialist can help with difficult cases."},{"id":"web_issue","category":"Website","tool":"Website","type":"choice","title":"Report a website issue","prompt":"You find a missing image, confusing description or an item you can't find on the website. What should you do?","options":["Email Web Support with the item details, what happened and a screenshot or link if available.","Ask the branch to stop using that item online until someone notices and fixes the listing.","Send the customer a different item and wait to report the issue until it affects another order."],"key":"A","why":"Email websupport@1sourcedist.com with enough detail to look into it. You can check with your digital specialist if you need help reporting the issue."},{"id":"access_form","category":"Website","tool":"Website","type":"choice","title":"Request customer access","prompt":"A customer wants access to the website or mobile app. How do you submit the request?","options":["Call the digital team and use the conversation instead of submitting the access form.","Email a named associate and have the customer choose their permissions in the message.","Use the Web & Mobile Access Form on the Digital Team intranet page and follow the submission process."],"key":"C","why":"Use the Web & Mobile Access Form on the Digital Team intranet page. Check with your digital specialist if you need help."},{"id":"lists_vs_fpp","category":"Website","tool":"Website","type":"choice","title":"Saved lists or purchase history?","prompt":"A customer wants to save a group of items for repeat buys, rather than just look at what they ordered before. Where would you point them?","options":["My Product Lists for saved groups of items; FPP for products from their ordering history.","Frequently Purchased Products for manually built lists; My Product Lists for their ordering history.","Orders and Quotes for saved product groups; My Product Lists only for shipment updates."],"key":"A","why":"My Product Lists helps with saved repeat-buy lists. FPP helps customers find products from their ordering history. Their digital specialist can show them both."},{"id":"pricing_source","category":"Website","tool":"Website","type":"choice","title":"Where website pricing comes from","prompt":"A customer's website price doesn't look right. What should you know before asking for help?","options":["The website uses pricing loaded in Eclipse for that customer, including item-specific or matrix pricing.","The website uses a separate price file, so Eclipse pricing does not help explain the customer price.","The website uses the last online order price, even when the customer pricing in Eclipse has changed."],"key":"A","why":"Start with the customer login and account, then the pricing loaded in Eclipse. Ask your digital specialist for help if the price still looks wrong."},{"id":"pricing_causes","category":"Website","tool":"Website","type":"choice","title":"Pricing issues","prompt":"The customer is signed in to the right account, but a price still looks wrong. What could explain it?","options":["Only the website image or description; customer pricing in Eclipse cannot affect the displayed price.","Missing or unmaintained pricing, a product override or an expired SPA agreement in the customer pricing.","Only the customer browser; an expired SPA agreement cannot affect the displayed price."],"key":"B","why":"Possible causes include missing pricing, overrides, unmaintained item pricing, expired SPAs and not being logged in as possible causes. Ask your digital specialist to help investigate."},{"id":"integration_handoff","category":"Website","tool":"Website","type":"choice","title":"Punchout, EDI and third-party tools","prompt":"A customer mentions Punchout, EDI, Elink, Ariba or Remarcable. Who should you involve?","options":["Start with Operations only and promise compatibility before asking the digital team about setup.","Check with your digital specialist or email Web Support; connect the customer with their digital specialist for the opportunity.","Start with a general ticket only and wait to involve the digital team until the customer has chosen a setup."],"key":"B","why":"Your digital specialist and websupport@1sourcedist.com are the support routes identified in this trainingzes. Gather the customer need rather than promising a setup."}]},"inside":{"name":"Inside Sales","time":20,"icon":"🧩","groups":{"DJC":10,"Website":20,"SOA":70},"questions":[{"id":"s2","category":"SOA","tool":"SOA","type":"choice","title":"Document intake","prompt":"You have a customer's bill of materials in a PDF. How can you get it into SOA?","options":["Type the PDF's lines into the email body, then connect the document to the customer and review the lines in SOA.","Drag and drop the PDF or email it as an attachment, then connect it to the customer and confirm or correct the lines in SOA.","Drag and drop the PDF or email it as an attachment, then connect it to the customer and send it to Eclipse without reviewing the lines."],"key":"B","why":"Drag and drop the document or email it as an attachment. Connect it to the customer in SOA, confirm or correct the lines in SOA, then send it to Eclipse."},{"id":"s3","category":"SOA","tool":"SOA","type":"order","title":"Workflow Builder","prompt":"Put these SOA steps in the order you would follow.","options":["Drag and drop the document into SOA or email it as an attachment.","Connect the document to an existing customer in SOA, or create the customer if needed.","Confirm or correct the lines in SOA against the original document.","Send the corrected document to Eclipse."],"key":"A > B > C > D","why":"Upload the document, connect it to the customer, confirm or correct the lines against the original, then send it to Eclipse."},{"id":"s4","category":"SOA","tool":"SOA","type":"choice","title":"Fix the document details","prompt":"SOA read \"Makita\" instead of \"Milwaukee\" from the uploaded PO. What should you do before sending it to Eclipse?","options":["Compare the line with the PO, then leave the description as it is because the document uploaded successfully.","Write the correct item on a separate note, then send the unchanged line to Eclipse and ask your digital specialist to fix it later.","Compare the line with the PO and correct it in SOA before sending it to Eclipse. The correction can help with future repeat documents."],"key":"C","why":"Correct the line in SOA so it matches the original PO, then send it to Eclipse. Corrections can help with repeat documents, but you should still review the lines each time."},{"id":"s5","category":"SOA","tool":"SOA","type":"choice","title":"Connect the customer","prompt":"You've uploaded a document, but the customer isn't in SOA. What should you do?","options":["Connect it to a customer with a similar name, then correct the lines and ask your digital specialist to change the customer afterward.","Add the customer using their shop account number or preferred ship-to (job account), then connect the document to them.","Leave the customer unconnected, then correct the lines and send the document to Eclipse so the customer can be added afterward."],"key":"B","why":"Connect the document to the customer in SOA. If the customer isn't there, add them. If you need to create the customer, use their shop account number or preferred ship-to."},{"id":"s6","category":"SOA","tool":"SOA","type":"choice","title":"Photo attachment or embedded image?","prompt":"A customer emails a photo of their material list pasted into the message body. How should you send that photo to SOA?","options":["Save the photo and attach it as a separate file when emailing it to SOA, so the material list is sent as an attachment.","Paste the photo into the email body. Keep it next to the customer's written instructions so SOA can read them together.","Forward the email as it is, leaving the photo in the message body so SOA can read it alongside the customer's instructions."],"key":"A","why":"Send the photo as an attachment, not pasted into the email body. If you're having trouble getting it into SOA, ask your digital specialist."},{"id":"s10","category":"SOA","tool":"SOA","type":"choice","title":"Repeat bills of materials","prompt":"Why is SOA a good fit for customers who send repeat bills of materials?","options":["It saves time typing repeat orders, so familiar documents can be connected to the customer and sent to Eclipse without checking the lines.","Once repeat material has been matched and corrections have been captured, SOA can save time compared with manually typing each order.","It keeps getting better when we upload documents, so uploading a repeat BOM is enough without connecting the customer or sending the corrected lines to Eclipse."],"key":"B","why":"SOA keeps getting better and can save time on repeat BOMs. Connect each document to the customer, confirm or correct the lines and send it to Eclipse, even when the document looks familiar."},{"id":"w1","category":"Website","tool":"Website","type":"choice","title":"Everyday website self-service","prompt":"Which everyday customer requests can we point to the website?","options":["Spec sheets, their pricing and availability, proof of delivery and accounting information they can look up without calling the branch.","Spec sheets, their pricing and availability, and access to our SOA queue so they can check the orders we're processing internally.","Proof of delivery, accounting information and permission settings so they can choose which accounts and information they have access to."],"key":"A","why":"The website is useful for spec sheets, pricing and availability, proof of delivery and accounting. Their digital specialist can demonstrate it or help with tricky questions."},{"id":"w2","category":"Website","tool":"Website","type":"choice","title":"Repeat buying and orders","prompt":"A customer wants to make quotes and orders online, look up past purchases and save items for repeat buys. What would you point out?","options":["Self-service quotes and orders, plus SOA's match history so they can use our matches to look up what they bought last year.","Self-service quotes and orders, 12 months of ordering history in FPP and custom product lists to make repeat buys easier.","Self-service quotes and orders, plus DJC releases so they can use project releases as their saved product lists on the website."],"key":"B","why":"Mention online quotes and orders, FPP's 12-month ordering history and custom product lists. Their digital specialist can show those features and the blanket order tool when needed."},{"id":"d3","category":"DJC","tool":"DJC","type":"choice","title":"Project visibility handoff","prompt":"A project customer wants to check material, releases, shipments and financials in one place. What should you suggest?","options":["DJC is a good fit for that project. Connect the customer with their digital specialist for setup and help.","Website product lists are a good fit for that project. Use them to give the team a shared view of material and financials.","SOA is a good fit for that project. Give the customer access to our processing queue to check shipments and financials."],"key":"A","why":"DJC is for projects. Connect the customer with their digital specialist and PM team for a demonstration, setup or project questions."},{"id":"web_issue","category":"Website","tool":"Website","type":"choice","title":"Report a website issue","prompt":"You find a missing image, confusing description or an item you can't find on the website. What should you do?","options":["Email Web Support with the item details, what happened and a screenshot or link if available.","Ask the branch to stop using that item online until someone notices and fixes the listing.","Send the customer a different item and wait to report the issue until it affects another order."],"key":"A","why":"Email websupport@1sourcedist.com with enough detail to look into it. You can check with your digital specialist if you need help reporting the issue."},{"id":"access_form","category":"Website","tool":"Website","type":"choice","title":"Request customer access","prompt":"A customer wants access to the website or mobile app. How do you submit the request?","options":["Call the digital team and use the conversation instead of submitting the access form.","Email a named associate and have the customer choose their permissions in the message.","Use the Web & Mobile Access Form on the Digital Team intranet page and follow the submission process."],"key":"C","why":"Use the Web & Mobile Access Form on the Digital Team intranet page. Check with your digital specialist if you need help."},{"id":"lists_vs_fpp","category":"Website","tool":"Website","type":"choice","title":"Saved lists or purchase history?","prompt":"A customer wants to save a group of items for repeat buys, rather than just look at what they ordered before. Where would you point them?","options":["My Product Lists for saved groups of items; FPP for products from their ordering history.","Frequently Purchased Products for manually built lists; My Product Lists for their ordering history.","Orders and Quotes for saved product groups; My Product Lists only for shipment updates."],"key":"A","why":"My Product Lists helps with saved repeat-buy lists. FPP helps customers find products from their ordering history. Their digital specialist can show them both."},{"id":"payment_nav","category":"Website","tool":"Website","type":"choice","title":"Pay an invoice","prompt":"A customer wants to pay an invoice online. Which option should they look for?","options":["Orders and Quotes, since viewing an order also gives every user access to invoice payments.","Manage and Pay Invoices, with the right payment permissions on their user account.","Digital Job Center, since project financial access automatically includes website payment access."],"key":"B","why":"Point the customer to Manage and Pay Invoices. Payment permissions still need to be enabled for that user."},{"id":"payment_permission","category":"Website","tool":"Website","type":"choice","title":"Payment permissions","prompt":"A customer can sign in but can't pay invoices online. What should you keep in mind?","options":["Every website user can pay invoices by default, so the issue must be the browser.","Seeing an invoice gives the user payment access, so the issue must be the invoice balance.","Payment access is not enabled for every user by default; check with your digital specialist for help."],"key":"C","why":"Signing in does not automatically give a user permission to pay invoices. Check with your digital specialist for help with the approved access process."},{"id":"shipment_window","category":"Website","tool":"Website","type":"choice","title":"Active Shipments window","prompt":"What time frame does the Active Shipments tile cover in this training?","options":["Seven days back and two days forward.","Two days back and seven days forward.","Twenty days back and twenty days forward."],"key":"A","why":"The supplied quiz baseline is seven days back and two days forward. Confirm this setting before using the question in the live game."},{"id":"calendar_date","category":"Website","tool":"Website","type":"choice","title":"Order Calendar date","prompt":"Which date on the sales order places it on the Order Management Calendar?","options":["The required date, even when the shipment date is different.","The backorder date, even when part of the order is shipping.","The shipment date, rather than the required or backorder date."],"key":"C","why":"This training uses the shipment date for the Order Management Calendar."},{"id":"pricing_source","category":"Website","tool":"Website","type":"choice","title":"Where website pricing comes from","prompt":"A customer's website price doesn't look right. What should you know before asking for help?","options":["The website uses pricing loaded in Eclipse for that customer, including item-specific or matrix pricing.","The website uses a separate price file, so Eclipse pricing does not help explain the customer price.","The website uses the last online order price, even when the customer pricing in Eclipse has changed."],"key":"A","why":"Start with the customer login and account, then the pricing loaded in Eclipse. Ask your digital specialist for help if the price still looks wrong."},{"id":"pricing_causes","category":"Website","tool":"Website","type":"choice","title":"Pricing issues","prompt":"The customer is signed in to the right account, but a price still looks wrong. What could explain it?","options":["Only the website image or description; customer pricing in Eclipse cannot affect the displayed price.","Missing or unmaintained pricing, a product override or an expired SPA agreement in the customer pricing.","Only the customer browser; an expired SPA agreement cannot affect the displayed price."],"key":"B","why":"Possible causes include missing pricing, overrides, unmaintained item pricing, expired SPAs and not being logged in as possible causes. Ask your digital specialist to help investigate."}]},"counter":{"name":"Counter Sales","time":15,"icon":"🛒","groups":{"DJC":10,"Website":80,"SOA":10},"questions":[{"id":"w1","category":"Website","too t them with their digital specialist to set up a DJC project before offering a way to release items from the buyout."],"key":"B","why":"The website blanket order tool handles commodity releases. Connect the customer with their digital specialist to show them how to use it."},{"id":"w3","category":"Website","tool":"Website","type":"choice","title":"Website access request","prompt":"A customer wants access to their online account. What should you do next?","options":["Fill out the Web & Mobile Access Form, let the customer choose their permissions and send it to Digital Web Support.","Fill out the Web & Mobile Access Form, copy another customer's permissions without checking and send it to Digital Web Support.","Fill out the Web & Mobile Access Form and send it to Digital Web Support. Ask your digital specialist if you need help; customers don't choose their permissions."],"key":"C","why":"Use the Web & Mobile Access Form and send it to Digital Web Support. Customers don't choose their own permissions. Your digital specialist can help with access questions. The form is on the Digital Team intranet page."},{"id":"w5","category":"Website","tool":"Website","type":"choice","title":"Access rescue","prompt":"A customer can't get into the website account they need. What should you do?","options":["Find out what's happening and try a coworker's login. Contact your digital specialist if that doesn't get them in.","Find out what's happening and contact your digital specialist for help with access through the approved process.","Find out what's happening and request access to more accounts. Contact your digital specialist once the customer is back in."],"key":"B","why":"Find out what the customer is seeing, then contact your digital specialist. Don't share logins or request access to unrelated accounts. Digital Business support: websupport@1sourcedist.com."},{"id":"s12","category":"SOA","tool":"SOA","type":"choice","title":"Counter upload basics","prompt":"A contractor gives you ng they need. Then ask their digital specialist to show them how it works.","Pick a likely tool and have them start using it before learning more about their needs. Then ask their digital specialist for a demonstration.","Find out what they're trying to do and connect them with their digital specialist. Help them explore the right tool while keeping personal support available."],"key":"C","why":"When a customer may benefit from a digital solution, connect them with their digital specialist. You can also check with your digital specialist for help identifying the right tool. Personal support stays available."},{"id":"web_issue","category":"Website","tool":"Website","type":"choice","title":"Report a website issue","prompt":"You find a missing image, confusing description or an item you can't find on the website. What should you do?","options":["Email Web Support with the item details, what happened and a screenshot or link if available.","Ask the branch to stop using that item online until someone notices and fixes the listing.","Send the customer a different item and wait to report the issue until it affects another order."],"key":"A","why":"Email websupport@1sourcedist.com with enough detail to look into it. You can check with your digital specialist if you need help reporting the issue."},{"id":"access_form","category":"Website","tool":"Website","type":"choice","title":"Request customer access","prompt":"A customer wants access to the website or mobile app. How do you submit the request?","options":["Call the digital team and use the conversation instead of submitting the access form.","Email a named associate and have the customer choose their permissions in the message.","Use the Web & Mobile Access Form on the Digital Team intranet page and follow the submission process."],"key":"C","why":"Use the Web & Mobile Access Form on the Digital Team intranet page. Check with your digital specialist if you need help."},{"id":"payment_nav","category":"Website","tool":"Website","type":"choice","title":"Pay an invoice","prompt":"A customer wants to pay an invoice online. Which option should they look for?","options":["Orders and Quotes, since viewing an order also gives every user access to invoice payments.","Manage and Pay Invoices, with the right payment permissions on their user account.","Digital Job Center, since project financial access automatically includes website payment access."],"key":"B","why":"Point the customer to Manage and Pay Invoices. Payment permissions still need to be enabled for that user."},{"id":"payment_permission","category":"Website","tool":"Website","type":"choice","title":"Payment permissions","prompt":"A customer can sign in but can't pay invoices online. What should you keep in mind?","options":["Every website user can pay invoices by default, so the issue must be the browser.","Seeing an invoice gives the user payment access, so the issue must be the invoice balance.","Payment access is not enabled for every user by default; check with your digital specialist for help."],"key":"C","why":"Signing in does not automatically give a user permission to pay invoices. Check with your digital specialist for help with the approved access process."},{"id":"shipment_status","category":"Website","tool":"Website","type":"choice","title":"Active Shipments statuses","prompt":"Which group includes the statuses available in the Active Shipments tile in this training?","options":["In fulfillment, ready for pickup and delivery in progress; complete and vendor fulfillment are excluded.","In fulfillment, ready for pickup, delivery in progress, fulfilling from vendor and complete.","Delivery in progress, complete and quote pending; pickup and vendor fulfillment are excluded."],"key":"B","why":"The statuses include in fulfillment, ready for pickup, delivery in progress, fulfilling from vendor and complete."},{"id":"pricing_source","category":"Website","tool":"Website","type":"choice","title":"Where website pricing comes from","prompt":"A customer's website price doesn't look right. What should you know before asking for help?","options":["The website uses pricing loaded in Eclipse for that customer, including item-specific or matrix pricing.","The website uses a separate price file, so Eclipse pricing does not help explain the customer price.","The website uses the last online order price, even when the customer pricing in Eclipse has changed."],"key":"A","why":"Start with the customer login and account, then the pricing loaded in Eclipse. Ask your digital specialist for help if the price still looks wrong."}]}};</script><script>// Andrew is a manually assigned arcade entry, 100 above the game maximum.
const PUBLISHED_FINISHERS=[{"runId": "andrew-kenny-manual-entry", "firstName": "Andrew", "lastName": "Kenny", "location": "Northern CA", "role": "Digital Specialist", "roleKey": "host", "isHost": true, "participationPoints": 1100, "tags": []}];</script><script>const app=document.getElementById('app');
const state={tab:'home',role:null,profile:{firstName:'',lastName:'',branchNumber:''},answers:{},first:{},mission:null,phase:'map',pick:null,order:[],pitch:'',hint:false,run:'',finished:null,mapOrder:[],search:'',filter:'all',notice:'',cleared:{},mapScroll:0};
const colors={DJC:'#0067b9',Website:'#007396',SOA:'#485cc7',Routing:'#008578'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const role=()=>CONTENT[state.role],items=()=>role()?.questions||[],mission=()=>items().find(q=>q.id===state.mission),count=()=>items().filter(q=>state.first[q.id]).length,complete=()=>items().length>0&&count()===items().length;
function score(){return Math.round(Object.entries(role().groups).reduce((s,[cat,w])=>{const qs=items().filter(q=>q.category===cat&&q.type!=='write');return s+w*qs.filter(q=>state.first[q.id]?.correct).length/qs.length},0))}

function accuracyFraction(){return Object.entries(role().groups).reduce((sum,[cat,w])=>{const qs=items().filter(q=>q.category===cat&&q.type!=='write');return sum+(qs.length?w/100*qs.filter(q=>state.first[q.id]?.correct).length/qs.length:0)},0)}
const correctAnswerPoints=()=>Math.round(MAX_PARTICIPATION_POINTS*0.90*accuracyFraction());
const totalPoints=()=>Math.round(count()*missionPoints()*0.10+MAX_PARTICIPATION_POINTS*0.90*accuracyFraction());
const allPowered=()=>items().length>0&&items().every(q=>state.cleared[q.id]);
const grade=()=>score()>=85?'Proficient':score()>=70?'Competent':'Needs work';
function key(){return 'dc2027-site-v6.3:'+JSON.stringify([state.profile.firstName.toLowerCase(),state.profile.lastName.toLowerCase(),state.profile.branchNumber,state.role])}
function save(){try{localStorage.setItem(key(),JSON.stringify({answers:state.answers,first:state.first,run:state.run,finished:state.finished,mapOrder:state.mapOrder,cleared:state.cleared}))}catch{state.notice='Browser saving unavailable. Keep this tab open and export at completion.'}}
function rng(seed){let n=2166136261;for(const c of seed)n=Math.imul(n^c.charCodeAt(0),16777619)>>>0;return ()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296}}
function mix(qs,seed){const random=rng(seed),pool=[...qs];for(let i=pool.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}const result=[];while(pool.length){const prev=result.at(-1)?.tool;let i=pool.findIndex(q=>q.tool!==prev);if(i<0)i=0;result.push(pool.splice(i,1)[0])}return result.map(q=>q.id)}
function selectRole(k){state.role=k;state.tab='entry';state.run='';state.answers={};state.first={};state.cleared={};state.notice='';render()}
function start(old){state.answers=old?.answers||{};state.first=old?.first||{};state.cleared=old?.cleared||{};for(const [id,a] of Object.entries(state.answers))if(a.correct||a.type==='write')state.cleared[id]=true;for(const [id,a] of Object.entries(state.first))if(a.correct||a.type==='write')state.cleared[id]=true;state.run=old?.run||('run-'+Date.now()+'-'+Math.random().toString(36).slice(2,8));state.finished=old?.finished||null;const valid=old?.mapOrder&&old.mapOrder.length===items().length&&new Set(old.mapOrder).size===items().length&&old.mapOrder.every(id=>items().some(q=>q.id===id));state.mapOrder=valid?old.mapOrder:mix(items(),state.run);state.tab='game';state.phase='map';state.mission=null;save();render()}
function entry(e){e.preventDefault();const f=new FormData(e.target);state.profile={firstName:f.get('firstName').trim(),lastName:f.get('lastName').trim(),branchNumber:f.get('branchNumber').trim()};if(!state.profile.firstName||!state.profile.lastName||!/^\d+$/.test(state.profile.branchNumber))return;let old;try{old=JSON.parse(localStorage.getItem(key())||'null')}catch{}if(old){state.pending=old;document.getElementById('resume').innerHTML='<p>A saved run exists for this name, branch and role.</p><button type="button" class="gold" data-action="resume">Resume</button> <button type="button" class="blue" data-action="new">New run</button>'}else start(null)}

function back(){state.phase='map';state.mission=null;save();render();requestAnimationFrame(()=>window.scrollTo({top:state.mapScroll||0,behavior:'instant'}))}
function submit(){const q=mission();const wasComplete=complete();if(state.phase!=='play'||(q.type==='choice'&&state.pick===null)||(q.type==='write'&&state.pitch.trim().split(/\s+/).filter(Boolean).length<20))return;const correct=q.type==='write'?null:q.type==='order'?state.order.join(',')==='0,1,2,3':String.fromCharCode(65+state.pick)===q.key;const a={questionId:q.id,type:q.type,correct,assisted:false,...(q.type==='write'?{response:state.pitch.trim(),reviewStatus:'pending-human-review'}:{selected:q.type==='order'?[...state.order]:state.pick})};state.answers[q.id]=a;if(correct||q.type==='write')state.cleared[q.id]=true;if(!state.first[q.id])state.first[q.id]={...a};if(complete()&&!state.finished)state.finished=new Date().toISOString();state.phase='feedback';save();if(complete()&&(!wasComplete||allPowered())){finish();return}render()}
function download(){if(!complete())return;const tags=['🎉 Quest completed','🧭 Expanded map explored',...(state.first.pitch?['🎙️ Pitch submitted']:[]),...(items().some(q=>q.type==='order')?['🧩 Workflow played']:[])];const publicBoardRecord={runId:state.run,...state.profile,roleKey:state.role,completedAt:state.finished,participationPoints:participationPoints(),totalPoints:totalPoints(),correctAnswerPoints:correctAnswerPoints(),scoringVersion:"7.0",maximumParticipationPoints:MAX_PARTICIPATION_POINTS,pointsPerMission:missionPoints(),tags};const result={schemaVersion:'7.2',contentVersion:'Question Editor v4.9',app:'Digital Competency 2027',runId:state.run,participant:state.profile,roleKey:state.role,role:role().name,completedAt:state.finished,mapOrder:state.mapOrder,participationPoints:participationPoints(),totalPoints:totalPoints(),correctAnswerPoints:correctAnswerPoints(),scoringVersion:"7.0",maximumParticipationPoints:MAX_PARTICIPATION_POINTS,pointsPerMission:missionPoints(),tags,objectiveScore:score(),grade:grade(),gradingNote:'First-attempt weighted knowledge checks; written pitch ungraded. Participation points independent of correctness. Historical training baseline, not official certification.',weights:role().groups,answers:items().map(q=>({...state.first[q.id],title:q.title,category:q.category,tool:q.tool})),latestAnswers:Object.values(state.answers),publicBoardRecord};const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='Digital-Competency-2027-v7.2-'+state.role+'-'+state.run+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function equipmentFor(q){
 if(['w2','lists_vs_fpp','s10'].includes(q.id))return 'reel';
 if(['access_form','payment_permission','w3','w5','d4','s5'].includes(q.id))return 'disconnect';
 if(['web_issue','pricing_causes','s4','s6','support_email'].includes(q.id))return 'junction';

 return 'luminaire';

function map(){const on=items().filter(q=>state.cleared[q.id]).length;return `<section class="breaker-map"><div class="heading"><div><h2>Power the Branch</h2><p>Clear a mission. Flip a breaker. Bring the branch to life.</p></div>${complete()?'<button class="gold" data-action="results">View final result</button>':''}</div><div class="breaker-layout"><svg class="power-cable" aria-hidden="true"><path class="cable-jacket"></path><path class="cable-highlight"></path><path class="cable-energy"></path></svg><div class="panel-cabinet"><div class="panel-nameplate"><strong>MISSION PANEL</strong><span>${on} / ${items().length} ON</span></div><div class="breaker-grid">${state.mapOrder.map((id,i)=>{const q=items().find(x=>x.id===id),cleared=!!state.cleared[id],played=!!state.first[id];return `<button class="breaker-row ${cleared?'breaker-on':''}" data-mission="${esc(id)}" aria-label="${esc(q.title)}, breaker ${cleared?'on, replay available':'off'}"><span class="circuit-number">${String(i+1).padStart(2,'0')}</span><span class="breaker-switch" aria-hidden="true"><span class="switch-position">${cleared?'ON':'OFF'}</span><span class="switch-handle"></span></span><span class="breaker-title"><strong>${esc(q.title)}</strong>${cleared?'<span class="replay-label">↻ Replay</span>':''}</span>${cleared?'<span class="breaker-status">Cleared</span>':played?'<span class="breaker-status retry-status">Try again</span>':''}</button>`}).join('')}</div><div class="panel-footer">Every breaker is available. Choose any mission.</div></div><aside class="power-preview">${branchReveal()}<p>Each cleared breaker lights another part of the branch.</p></aside></div></section>`}
function question(){const q=mission(),f=state.phase==='feedback';return `<section class="card mission"><button class="back" data-action="map">← Back to mission map</button><h2>${esc(q.title)}</h2><p>${esc(q.prompt)}</p><div class="options">${q.type==='write'?`<label for="pitch">Your customer pitch</label><textarea id="pitch" rows="6" maxlength="1500" ${f?'disabled':''}>${esc(state.pitch)}</textarea><small id="word-count">${state.pitch.trim().split(/\s+/).filter(Boolean).length} words • Minimum 20 • Maximum 1,500 characters</small>`:q.type==='order'?state.order.map((n,i)=>`<div class="option"><b>${i+1}</b><span style="flex:1">${esc(q.options[n])}</span>${f?'':`<div class="order-buttons"><button aria-label="Move up" data-move="${i},-1" ${i===0?'disabled':''}>↑</button><button aria-label="Move down" data-move="${i},1" ${i===state.order.length-1?'disabled':''}>↓</button></div>`}</div>`).join(''):q.options.map((t,i)=>`<button class="option ${state.pick===i?'selected':''} ${f&&String.fromCharCode(65+i)===q.key?'correct':''} ${f&&state.pick===i&&!state.answers[q.id].correct?'wrong':''}" data-pick="${i}" aria-pressed="${state.pick===i}" ${f?'disabled':''}><b>${String.fromCharCode(65+i)}</b><span>${esc(t)}</span></button>`).join('')}</div>${f?`<div class="feedback"><h2>${q.type==='write'?'Pitch captured':state.answers[q.id].correct?'Mission cleared!':'A useful learning moment'}</h2><p>${esc(q.why)}</p>${q.type==='order'&&!state.answers[q.id].correct?`<p>Correct sequence: ${esc(q.options.join(' → '))}</p>`:''}</div><div class="actions"><button class="blue" data-action="map">Choose another mission</button>${!complete()?'<button class="gold" data-action="next">Play next mission →</button>':''}${complete()?'<button class="gold" data-action="results">Reveal final result</button>':''}</div>`:`<div class="actions"><button id="submit" class="blue" data-action="submit" ${(q.type==='choice'&&state.pick===null)||(q.type==='write'&&state.pitch.trim().split(/\s+/).filter(Boolean).length<20)?'disabled':''}>${q.type==='write'?'Save pitch':'Lock in your move'}</button></div>`}</section>`}
function finish(){recordCompletion();state.phase='victory';render();window.scrollTo(0,0);setTimeout(()=>{if(state.phase==='victory'){state.phase='results';render();window.scrollTo(0,0)}},1400)}
function emailLink(){return 'mailto:a.kenny@1sourcedist.com?subject='+encodeURIComponent('Digital Competency 2027 - '+role().name+' - '+state.profile.firstName+' '+state.profile.lastName)+'&body='+encodeURIComponent('Hi Andrew,\n\nAttached is my Digital Competency 2027 result.\n\n'+state.profile.firstName+' '+state.profile.lastName+'\nBranch '+state.profile.branchNumber+'\n\n[Attach the downloaded JSON file before sending.]')}
function results(){return `<section class="results endgame"><div class="endgame-kicker">QUEST COMPLETE</div>${branchReveal()}<h1>Nice Work!</h1><p class="endgame-player">${esc(state.profile.firstName)} ${esc(state.profile.lastName)} • ${esc(role().name)}</p><div class="final-stats"><div><small>FINAL RESULT</small><strong>${grade()}</strong></div><div><small>ACCURACY</small><strong>${score()}%</strong></div><div><small>POINTS</small><strong>${totalPoints()}</strong></div></div>${state.first.pitch?`<div class="pitch"><b>Your customer pitch</b><p>${esc(state.first.pitch.response)}</p></div>`:''}${!allPowered()?'<div class="power-replay"><p>Your score is locked. Replay missed missions to switch on every breaker.</p><button class="blue" data-action="map">Power the remaining breakers →</button></div>':''}<div class="send-result"><h2>Send your result to Andrew</h2><button class="gold" data-action="export">Click here to export your JSON</button><p>Then email the downloaded file to <a href="${esc(emailLink())}">a.kenny@1sourcedist.com</a>.</p><a class="email-button" href="${esc(emailLink())}">Open email draft →</a><p class="fine">Attach the downloaded JSON before sending. The email link opens your default email app, including Outlook if it is your default. It cannot attach the file automatically.</p></div></section>`}
function drawPowerCable(){const layout=document.querySelector('.breaker-layout'),panel=document.querySelector('.panel-cabinet'),inlet=document.querySelector('.service-inlet'),svg=document.querySelector('.power-cable');if(!layout||!panel||!inlet||!svg)return;const l=layout.getBoundingClientRect(),p=panel.getBoundingClientRect(),t=inlet.getBoundingClientRect();const stacked=t.left<p.right;let x1,y1,x2=t.left-l.left+t.width/2,y2=t.top-l.top+t.height/2,d;if(stacked){x1=p.left-l.left+p.width*.82;y1=p.bottom-l.top;const bend=y1+24;d=`M ${x1} ${y1} L ${x1} ${bend} Q ${x1} ${bend+16} ${x1-16} ${bend+16} L ${x2+20} ${bend+16} Q ${x2} ${bend+16} ${x2} ${bend+36} L ${x2} ${y2}`;}else{x1=p.right-l.left;y1=Math.min(150,p.height*.3);const mid=x1+Math.max(16,(x2-x1)*.4);d=`M ${x1} ${y1} L ${mid-16} ${y1} Q ${mid} ${y1} ${mid} ${y1+16} L ${mid} ${y2-18} Q ${mid} ${y2} ${mid+18} ${y2} L ${x2} ${y2}`;}svg.setAttribute('viewBox',`0 0 ${l.width} ${l.height}`);svg.querySelectorAll('path').forEach(path=>path.setAttribute('d',d));svg.classList.toggle('energized',items().some(q=>state.cleared[q.id]));}
window.addEventListener('resize',()=>requestAnimationFrame(drawPowerCable));
function render(){let body='';if(state.tab==='home')body=`<div class="hero"><span class="pill">CHOOSE YOUR ROLE. START YOUR QUEST.</span><h1>Digital Competency <span>2027</span></h1></div><div class="cards">${Object.entries(CONTENT).map(([k,r])=>`<article class="card"><div class="card-top"><span class="emoji">${r.icon}</span></div><h2>${r.name}</h2><div class="weights">${Object.entries(r.groups).map(([c,w])=>`<div><span>${esc(c)}</span><b>${w}%</b></div>`).join('')}</div><button class="blue" data-role="${k}">Enter the game →</button></article>`).join('')}</div>`;
else if(state.tab==='entry')body=`<form id="entry" class="card entry"><button type="button" class="back" data-tab="home">← Choose another role</button><h2>Join the quest</h2><p>${role().name} • ${items().length} missions</p>${[['firstName','First name'],['lastName','Last name'],['branchNumber','Branch number']].map(([k,l])=>`<label>${l}<input name="${k}" required maxlength="${k==='branchNumber'?20:80}" ${k==='branchNumber'?'pattern="[0-9]+" inputmode="numeric"':''} autocomplete="${k==='firstName'?'given-name':k==='lastName'?'family-name':'off'}" value="${esc(state.profile[k])}"></label>`).join('')}<p class="fine">Name and branch are exported with your result. The organizer may publish your name, branch, participation points and tags, but not your answers or pitch.</p><button class="blue" type="submit">Start quest</button><div id="resume" class="actions"></div></form>`;
else if(state.tab==='board')body=`<div class="arcade-heading"><h1>LEADERBOARD</h1><span class="arcade-line" aria-hidden="true"></span></div><div class="actions" style="margin-bottom:24px"><input id="board-search" aria-label="Search name or branch" placeholder="Search name or branch" value="${esc(state.search)}"><select id="board-filter" aria-label="Filter role"><option value="all">All roles</option>${Object.entries(CONTENT).map(([k,r])=>`<option value="${k}" ${state.filter===k?'selected':''}>${r.name}</option>`).join('')}</select></div><div id="board-rows"></div>`;
else if(state.phase==='victory')body='<section class="victory-flash" role="status"><h1>Nice Work!</h1><p>Quest complete</p></section>';
else if(state.phase==='results'&&complete())body=results();
else body=`<h2>${role().name} Quest</h2><p>${esc(state.profile.firstName)} ${esc(state.profile.lastName)} • Branch ${esc(state.profile.branchNumber)}</p><div class="hud"><div><small>Total points</small><br><strong>${totalPoints()}</strong></div><div><small>Missions submitted</small><br><strong>${count()}/${items().length}</strong></div><div style="flex:1;min-width:160px"><small>System progress</small><div class="progress"><div style="width:${count()/items().length*100}%"></div></div></div></div>${state.notice?`<p class="notice" role="status">${esc(state.notice)}</p>`:''}${state.phase==='map'?map():state.phase==='results'&&complete()?results():question()}`;

if(state.tab==='entry')document.getElementById('entry').addEventListener('submit',entry);if(state.tab==='board'){drawBoard();document.getElementById('board-search').addEventListener('input',e=>{state.search=e.target.value;drawBoard()});document.getElementById('board-filter').addEventListener('change',e=>{state.filter=e.target.value;drawBoard()})}const p=document.getElementById('pitch');if(p&&!p.disabled)p.addEventListener('input',e=>{state.pitch=e.target.value;const n=state.pitch.trim().split(/\s+/).filter(Boolean).length;document.getElementById('word-count').textContent=n+' words • Minimum 20 • Maximum 1,500 characters';document.getElementById('submit').disabled=n<20})}
const BOARD_STORE='dc2027-completions-v2';
// Reset previous local board entries once for this release; keep saved game progress.
try{if(!localStorage.getItem('dc2027-board-reset-v6.2')){localStorage.removeItem('dc2027-completions-v1');localStorage.removeItem(BOARD_STORE);localStorage.setItem('dc2027-board-reset-v6.2','done')}}catch{}
function localFinishers(){try{const x=JSON.parse(localStorage.getItem(BOARD_STORE)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function recordCompletion(){if(!complete())return;const record={runId:state.run,...state.profile,roleKey:state.role,completedAt:state.finished,participationPoints:participationPoints(),totalPoints:totalPoints(),correctAnswerPoints:correctAnswerPoints(),scoringVersion:"7.0",maximumParticipationPoints:MAX_PARTICIPATION_POINTS,pointsPerMission:missionPoints(),tags:['🎉 Quest completed',...(state.first.pitch?['🎙️ Pitch submitted']:[])]};const records=localFinishers();const i=records.findIndex(x=>x.runId===record.runId);if(i<0)records.push(record);else records[i]=record;try{localStorage.setItem(BOARD_STORE,JSON.stringify(records))}catch{state.notice='Your result could not be saved to this browser’s leaderboard. Export your JSON to keep a copy.'}}
function allFinishers(){const map=new Map(PUBLISHED_FINISHERS.map(x=>[x.runId,x]));for(const x of localFinishers())if(x.scoringVersion==="7.0")map.set(x.runId,x);return [...map.values()]}
function nextMission(){const index=state.mapOrder.indexOf(state.mission);const ids=[...state.mapOrder.slice(index+1),...state.mapOrder.slice(0,index)];const id=ids.find(id=>!state.first[id]);if(id){const y=state.mapScroll;play(id);state.mapScroll=y}else if(complete())finish();else back()}
function drawBoard(){const rows=allFinishers().filter(x=>(state.filter==='all'||x.isHost||x.roleKey===state.filter)&&[x.firstName,x.lastName,x.branchNumber,x.location].join(' ').toLowerCase().includes(state.search.toLowerCase()));document.getElementById('board-rows').innerHTML=rows.length?`<section class="arcade-board"><div class="arcade-columns"><span>PLAYER</span><span>LOCATION / ROLE</span><span>POINTS</span></div>${rows.map(x=>`<article class="arcade-row"><div class="arcade-player"><span class="player-marker" aria-hidden="true">◆</span><strong>${esc(x.firstName)} ${esc(x.lastName)}</strong></div><div class="arcade-details"><span>${esc(x.isHost?'Northern CA':'Branch '+x.branchNumber)}</span><small>${esc(x.isHost?'Digital Specialist':CONTENT[x.roleKey]?.name||x.roleKey)}</small></div><strong class="arcade-score">${esc(x.totalPoints??x.participationPoints)}</strong></article>`).join('')}</section>`:`<section class="arcade-board arcade-empty"><h2>No matching players</h2></section>`}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.role){selectRole(b.dataset.role);return}if(b.dataset.tab){state.tab=b.dataset.tab;if(state.tab==='game')state.phase='map';render();return}if(b.dataset.mission){play(b.dataset.mission);return}if(b.dataset.pick!==undefined){state.pick=Number(b.dataset.pick);render();return}if(b.dataset.move){const [i,d]=b.dataset.move.split(',').map(Number);[state.order[i],state.order[i+d]]=[state.order[i+d],state.order[i]];render();return}switch(b.dataset.action){case 'resume':start(state.pending);break;case 'new':start(null);break;case 'map':back();break;case 'next':nextMission();break;case 'results':if(complete())finish();break;case 'submit':submit();break;case 'export':download();break}});
